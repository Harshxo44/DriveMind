spring:
  application:
    name: guardian-backend
  profiles:
    default: local
  datasource:
    url: jdbc:h2:mem:guardiandb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    open-in-view: false
  h2:
    console:
      enabled: true
      path: /h2-console

server:
  port: 8080

guardian:
  jwt:
    secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
    expiration-ms: 86400000 # 24 hours
  ai:
    # Provider: GROQ (100% free & ultra-fast ~250ms), OPENROUTER, ANTHROPIC, or LOCAL
    provider: ${AI_PROVIDER:GROQ}
    # Free Groq endpoint & default model (No credit card required at console.groq.com)
    groq:
      api-key: ${GROQ_API_KEY:mock-key}
      model: ${GROQ_MODEL:llama-3.3-70b-versatile}
      api-url: https://api.groq.com/openai/v1/chat/completions
    # Free OpenRouter endpoint (openrouter.ai free models)
    openrouter:
      api-key: ${OPENROUTER_API_KEY:mock-key}
      model: ${OPENROUTER_MODEL:meta-llama/llama-3.2-3b-instruct:free}
      api-url: https://openrouter.ai/api/v1/chat/completions
    # Anthropic Claude endpoint
    anthropic:
      api-key: ${ANTHROPIC_API_KEY:mock-key}
      model: ${ANTHROPIC_MODEL:claude-sonnet-5}
      api-url: https://api.anthropic.com/v1/messages
